name: GeoLibre contract drift

# GeoLibre's hideable ids (data sources, menus, menu items, built-in plugins)
# live in its source tree, and the deployment.json schema in its `schema/`
# directory. Fail when either committed copy falls behind, so someone runs
# `npm run sync:catalog` / `npm run sync:schema` and reviews the change.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: opengeos/GeoLibre
          path: GeoLibre
          sparse-checkout: |
            apps/geolibre-desktop/src
            packages/plugins/src
            schema
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:catalog -- GeoLibre
      - run: npm run sync:schema -- GeoLibre
      - name: Compare catalog and schema (ignoring the source commit)
        run: |
          git diff --stat -- src/catalog schema
          git diff -U0 -- src/catalog schema ':(exclude)schema/SOURCE.json' | grep -E '^[+-] ' | grep -v '"commit"' && exit 1 || echo "Catalog and schema are current."
